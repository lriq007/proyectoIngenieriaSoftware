{% load static %}
<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Etapa 1 — Trabajo en Equipo</title>

  <!-- Estilos organizados -->
  <link rel="stylesheet" href="{% static 'etapasJuego/css/base.css' %}">
  <link rel="stylesheet" href="{% static 'etapasJuego/css/components.css' %}">
  <link rel="stylesheet" href="{% static 'etapasJuego/css/theme_login_port.css' %}">
  <link rel="stylesheet" href="{% static 'etapasJuego/css/wordsearch.css' %}">
  <link rel="stylesheet" href="{% static 'etapasJuego/css/etapa1.css' %}">  <!-- ← NUEVO -->
</head>

<body>
  {% include 'etapasJuego/mascota.html' %}
  
  <div class="app-noise"></div>

  <!-- Barra de progreso -->
  <div id="progress-bar">
    <div>
      <span>Etapa 1 de 4</span>
      <div>
        <div style="width:25%;"></div>
      </div>
    </div>
  </div>

  <!-- Contenido principal -->
  <div class="ws-container">
    <div class="ws-header">
      <h1 class="ws-title">Etapa 1 — Sopa de Letras</h1>  <!-- ← AHORA CENTRADO -->
    </div>

    <main class="ws-main">
      <div id="ws-board" class="ws-board" aria-label="Sopa de letras"></div>

      <aside class="ws-sidebar">
        <h2>Palabras</h2>
        <ul id="ws-words"></ul>
        <div class="ws-legend">
          <div><span class="dot dot1"></span>Jugador A</div>
          <div><span class="dot dot2"></span>Jugador B</div>
        </div>
        
        <div class="ws-actions">
          <button id="ws-reset" class="btn ws-reset">Reiniciar</button>
          <div id="ws-progress" class="comic-progress">100%</div>
        </div>
      </aside>
    </main>
  </div>

  <!-- Modal de etapa completada -->
  <div id="ws-complete" class="ws-complete" hidden>
    <div>
      <h2>¡Etapa completada! 🎉</h2>
      <p>Excelente trabajo en equipo. Pueden avanzar a la siguiente etapa.</p>
      <a href="{% url 'etapa2' %}" class="ws-button">Ir a la Etapa 2 →</a>
    </div>
  </div>

  <!-- Navegación -->
  <div class="nav-actions">
    <a href="{% url 'etapa2' %}" class="btn-arrow btn-arrow-right" title="Avanzar">
      <span class="arrow-icon">➜</span>
    </a>
  </div>

  <!-- Scripts -->
  <script>
    function getCookie(name) {
      const value = `; ${document.cookie}`;
      const parts = value.split(`; ${name}=`);
      if (parts.length === 2) return parts.pop().split(';').shift();
    }
    window.CSRF_TOKEN = getCookie('csrftoken');
  </script>

  <script src="{% static 'etapasJuego/js/wordsearch.js' %}"></script>
</body>
</html>
