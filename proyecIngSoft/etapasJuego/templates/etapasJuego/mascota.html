{% load static %}

<!-- Mascota fija en la esquina superior izquierda -->
<div class="mascota-saludo">
  <img
    src="{% static 'etapasJuego/mascota/mascota.png' %}"
    alt="Camaleón del juego saludando"
    class="mascota"
    loading="eager"
  />
</div>

<style>
  /* Contenedor fijo: esquina superior izquierda */
  .mascota-saludo {
    position: fixed;
    top: 1.2rem;           /* separación del borde superior */
    left: 1.2rem;          /* separación del borde izquierdo */
    z-index: 120;          /* sobre el contenido */
    pointer-events: none;  /* no bloquea clics */
  }

  /* Imagen del camaleón */
  .mascota {
    width: clamp(120px, 16vw, 220px);
    height: auto;
    display: block;
    animation:
      cam-bob 2.6s ease-in-out infinite,   /* movimiento suave / respiración */
      cam-wave 3s ease-in-out infinite;    /* saludo con pequeño giro */
    transform-origin: 30% 90%;             /* ajusta el eje de giro para que salude hacia el centro */
    filter: drop-shadow(0 6px 8px rgba(0,0,0,.2));
    will-change: transform;
  }

  /* Movimiento tipo respiración */
  @keyframes cam-bob {
    0%,100% { transform: translateY(0); }
    50%     { transform: translateY(-3px); }
  }

  /* Movimiento de saludo */
  @keyframes cam-wave {
    0%,100% { rotate: 0deg; }
    40%     { rotate: -5deg; } /* giro hacia adentro */
    60%     { rotate: 5deg; }
  }

  @media (prefers-reduced-motion: reduce) {
    .mascota { animation: none; }
  }
</style>
